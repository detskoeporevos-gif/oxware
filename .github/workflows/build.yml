name: Build oxware (MSVC x86)

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'
          msbuild-architecture: x86

      - name: Prepare shared lib directory
        shell: cmd
        run: |
          if not exist src\lib mkdir src\lib

      # The solution has no explicit project dependencies and the cheat project
      # is listed first, so build the static libraries in order manually.
      # On failure, surface compiler/linker errors as annotations so they can be
      # read without downloading the raw job log.
      - name: Build dependencies and cheat
        shell: cmd
        run: |
          @echo off
          for %%P in (
            src\tier\tier.vcxproj
            src\external\detours\detours.vcxproj
            src\assets\assets.vcxproj
            src\gsdecrypt\gsdecrypt.vcxproj
            src\injector\injector.vcxproj
            src\multiemulator\multiemulator.vcxproj
            src\external\soil\soil.vcxproj
            src\util\util.vcxproj
            src\external\imgui\imgui.vcxproj
            src\gui\oxUI.vcxproj
            src\loader\loader.vcxproj
            src\cheat\cheater.vcxproj
          ) do (
            echo === Building %%P ===
            call msbuild %%P /p:Configuration=Release /p:Platform=Win32 /m:1 /v:minimal > build_log.txt 2>&1
            if errorlevel 1 (
              type build_log.txt
              for /f "delims=" %%L in ('findstr /i /c:"error " /c:"LNK" /c:"MSB" build_log.txt') do echo ::error::%%L
              exit /b 1
            )
          )

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: oxware-release-x86
          path: |
            build/**
          if-no-files-found: warn
